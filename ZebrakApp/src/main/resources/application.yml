spring:
  application:
    name: ZebrakApp
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      timeout: 2000ms
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED}
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS}
  upload:
    dir: ${UPLOAD_DIR}
  cors:
    allowed-origins: ${CORS_ORIGINS}
  rate-limit:
    place-creation:
      min-interval-seconds: ${RATE_LIMIT_PLACE_MIN_INTERVAL}
      max-requests-per-minute: ${RATE_LIMIT_PLACE_MAX_PER_MINUTE}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.apache.tomcat.util.http.parser.Cookie: WARN
