spring:
  application:
    name: ZebrakApp
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zebrakdb}
    username: ${DB_USERNAME:zebrakuser}
    password: ${DB_PASSWORD:zebrakpass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

app:
  jwt:
    secret: ${JWT_SECRET:testSecretKeyForTestingPurposesWith32CharsLong!}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200,http://localhost:80,http://localhost}
  rate-limit:
    place-creation:
      min-interval-seconds: ${RATE_LIMIT_PLACE_MIN_INTERVAL:0}
      max-requests-per-minute: ${RATE_LIMIT_PLACE_MAX_PER_MINUTE:100}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  api-docs:
    path: /v3/api-docs

logging:
  level:
    org.apache.tomcat.util.http.parser.Cookie: WARN
