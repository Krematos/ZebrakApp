spring:
  application:
    name: ZebrakApp
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${DB_USERNAME:myuser}
    password: ${DB_PASSWORD:secret}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB

app:
  jwt:
    secret: ${JWT_SECRET:dGVzdFNlY3JldEtleUZvclplYnJha0FwcFRlc3RpbmdPbmx5TmVlZHNUb0JlQXRMZWFzdDI1NkJpdHNMb25nMTIzNDU2Nzg5MA==}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost,http://localhost:4200,http://localhost:80,http://127.0.0.1:4200}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    doc-expansion: none
  api-docs:
    path: /v3/api-docs

