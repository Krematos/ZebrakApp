name: zebrakapp

services:
  postgres:
    image: postgres:18-alpine
    container_name: zebrak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - zebrak-net

  redis:
    image: redis:7-alpine
    container_name: zebrak-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - zebrak-net

  backend:
    build:
      context: ../ZebrakApp
      dockerfile: ../deploy/Dockerfile.backend
    container_name: zebrak-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
      CORS_ORIGINS: ${CORS_ORIGINS}
      RATE_LIMIT_PLACE_MIN_INTERVAL: ${RATE_LIMIT_PLACE_MIN_INTERVAL}
      RATE_LIMIT_PLACE_MAX_PER_MINUTE: ${RATE_LIMIT_PLACE_MAX_PER_MINUTE}
      DOCKER_COMPOSE_ENABLED: "false"
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: zebrak-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - uploads:/var/www/uploads:ro
    networks:
      - zebrak-net

volumes:
  pgdata:
  uploads:
  redisdata:

networks:
  zebrak-net:
    driver: bridge
