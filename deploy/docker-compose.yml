services:
  postgres:
    image: postgres:18-alpine
    container_name: zebrak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zebrakuser -d zebrakdb"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
        - zebrak-net

  backend:
    build:
      context: ../ZebrakApp
      dockerfile: ../deploy/Dockerfile.backend
    container_name: zebrak-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/zebrakdb
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      UPLOAD_DIR: /app/uploads
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: http://localhost,http://localhost:80,http://localhost:4200
    volumes:
      - uploads:/app/uploads
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    container_name: zebrak-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend/dist/frontend/browser:/usr/share/nginx/html:ro
      - uploads:/var/www/uploads:ro

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    container_name: zebrak-frontend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - uploads_data:/var/www/uploads
    depends_on:
      - backend
    networks:
      - zebrak-net
    restart: unless-stopped

volumes:
  pgdata:
  uploads:

networks:
  zebrak-net:
    driver: bridge
